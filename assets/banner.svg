<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Farmoz - Web and AI Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)" opacity="0.30"/>
  <circle cx="1080" cy="40" r="190" fill="#22d3ee" opacity="0.10"/>
  <circle cx="200" cy="270" r="210" fill="#a78bfa" opacity="0.10"/>
  <g transform="translate(80,120)">
    <text x="0" y="0" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="78" font-weight="800" fill="#e6edf7" letter-spacing="6">FARMOZ</text>
    <rect x="6" y="24" width="168" height="7" rx="3.5" fill="url(#acc)"/>
    <text x="4" y="82" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="27" font-weight="500" fill="#8fa1bd">Websites that sell &#183; AI that does the busywork</text>
  </g>
</svg>
