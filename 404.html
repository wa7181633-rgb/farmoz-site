<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Farmoz</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#06080f" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#06080f;--panel:#0c1220;--line:rgba(148,163,184,.16);--text:#e6edf7;--muted:#8fa1bd;--accent:#22d3ee;--accent-2:#a78bfa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
       font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}
  .glow{position:fixed;inset:0;pointer-events:none;
        background:radial-gradient(60% 50% at 50% 0%,rgba(34,211,238,.16),transparent 70%),
                   radial-gradient(50% 50% at 80% 100%,rgba(167,139,250,.14),transparent 70%)}
  .card{position:relative;max-width:620px}
  .code{font-family:Sora,Inter,sans-serif;font-size:clamp(84px,18vw,150px);font-weight:800;line-height:1;
        background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:Sora,Inter,sans-serif;font-size:clamp(24px,5vw,34px);margin:12px 0 10px}
  p{color:var(--muted);font-size:17px;line-height:1.65}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  a{text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px;font-size:15px;transition:.2s}
  .primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#06080f}
  .primary:hover{transform:translateY(-2px)}
  .ghost{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The link is broken or the page moved. Head back home — or message me and I'll point you to what you were looking for.</p>
    <div class="actions">
      <a class="primary" href="/">Back to home</a>
      <a class="ghost" href="mailto:farmoz98@gmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
