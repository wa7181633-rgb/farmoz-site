<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Farmoz — websites that sell, AI that does the busywork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>
  <circle cx="1010" cy="120" r="240" fill="#22d3ee" opacity="0.12"/>
  <circle cx="170" cy="560" r="260" fill="#a78bfa" opacity="0.12"/>

  <g transform="translate(90,140)">
    <rect x="0" y="-46" width="150" height="34" rx="17" fill="#0f1a2e" stroke="#1e293b"/>
    <circle cx="22" cy="-29" r="6" fill="#34d399"/>
    <text x="40" y="-23" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" fill="#8fa1bd">Available for work</text>

    <text x="0" y="52" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="64" font-weight="800" fill="#e6edf7">Websites that <tspan fill="#22d3ee">sell</tspan>.</text>
    <text x="0" y="130" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="64" font-weight="800" fill="#e6edf7">AI that does the <tspan fill="#a78bfa">busywork</tspan>.</text>

    <text x="0" y="196" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="24" fill="#8fa1bd">Custom landing pages, launch-ready templates &amp; AI automations.</text>
    <rect x="2" y="232" width="230" height="6" rx="3" fill="url(#acc)"/>
  </g>

  <g transform="translate(90,500)">
    <text x="0" y="0" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#e6edf7" letter-spacing="3">FARMOZ</text>
    <text x="220" y="0" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="22" fill="#8fa1bd">Web &amp; AI Systems &#183; fixed price, fixed timeline</text>
  </g>
</svg>
